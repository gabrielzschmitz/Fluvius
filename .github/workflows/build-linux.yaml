name: Build Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential xorg-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev premake4

      - name: Generate project files
        run: |
          cd build
          ./premake5 gmake

      - name: Build Release
        run: |
          make config=release_x64

      - name: Package Linux release
        run: |
          mkdir -p dist
          cp bin/Release/fluvius dist/
          cp -r resources dist/

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: Fluvius-linux
          path: dist/

      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/package_release.py dist --out dist/Fluvius-linux.zip .

      - name: Attach asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fluvius-linux.zip
          fail_on_unmatched_files: true
