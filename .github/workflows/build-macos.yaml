name: Build macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure Xcode tools
        run: |
          xcode-select --install || true
          xcode-select -p

      - name: Generate project files
        run: |
          cd build
          chmod +x premake5.osx
          ./premake5.osx gmake

      - name: Build Release
        run: |
          make config=release_x64 CC=clang CXX=clang++

      - name: Package macOS release
        run: |
          mkdir -p dist release
          cp bin/Release/fluvius dist/
          cp -r resources dist/

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: Fluvius-macos
          path: dist/

      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/package_release.py dist --out release/Fluvius-macos.zip .

      - name: Attach asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Fluvius-macos.zip
          fail_on_unmatched_files: true
