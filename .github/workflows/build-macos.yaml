name: Build macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure Xcode tools
        run: |
          xcode-select --install || true
          xcode-select -p

      - name: Generate project files
        run: |
          cd build
          chmod +x premake5.osx
          ./premake5.osx gmake

      - name: Build Release
        run: |
          make config=release_x64 CC=clang CXX=clang++

      - name: Package macOS release zip
        run: |
          mkdir -p dist
          cp bin/Release/fluvius dist/
          cp -r resources dist/
          python3 scripts/package_release.py dist --out dist/Fluvius-macos.zip .

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: Fluvius-macos
          path: dist/Fluvius-macos.zip
