name: Build Web

on:
  push:
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Activate Emscripten environment
        run: |
          cd emsdk
          source ./emsdk_env.sh
          echo "EMSDK activated"

      - name: Generate project files
        run: |
          source emsdk/emsdk_env.sh
          cd build
          ./premake5 gmake --with-emscripten --graphics=openges2

      - name: Build Web release
        run: |
          source emsdk/emsdk_env.sh
          emmake make config=release_web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluvius-web
          path: |
            bin/Release/fluvius.html
            bin/Release/fluvius.js
            bin/Release/fluvius.wasm
            bin/Release/fluvius.data

      - name: Stage web outputs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist-web dist
          cp bin/Release/fluvius.html dist-web/index.html
          cp bin/Release/fluvius.js dist-web/fluvius.js
          cp bin/Release/fluvius.wasm dist-web/fluvius.wasm
          cp bin/Release/fluvius.data dist-web/fluvius.data
          cp resources/icon.png dist-web/icon.png
          cp bin/Release/fluvius-web.zip dist/Fluvius-web.zip

      - name: Attach asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fluvius-web.zip
          fail_on_unmatched_files: true

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluvius
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
