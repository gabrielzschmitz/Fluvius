name: Build Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc make unzip

      - name: Generate project files
        shell: msys2 {0}
        run: |
          cd build
          ./premake5.exe gmake

      - name: Build Release
        shell: msys2 {0}
        run: |
          make config=release_x64

      - name: Package Windows release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist,release | Out-Null
          Copy-Item bin/Release/fluvius.exe dist\
          Copy-Item resources dist\resources -Recurse

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Fluvius-windows
          path: dist/

      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: Compress-Archive -Path dist\* -DestinationPath release\Fluvius-windows.zip

      - name: Attach asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Fluvius-windows.zip
          fail_on_unmatched_files: true
